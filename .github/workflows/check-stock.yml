name: Check TimeCigar stock

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check inventory and notify subscribers
        env:
          MONITOR_ENDPOINT: ${{ secrets.MONITOR_ENDPOINT }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: python monitor/monitor.py
