name: Deploy public site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure public endpoint
        env:
          SUBSCRIPTION_ENDPOINT: ${{ secrets.SUBSCRIPTION_ENDPOINT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          template = Path("site/config.template.js").read_text()
          endpoint = os.environ.get("SUBSCRIPTION_ENDPOINT", "")
          Path("site/config.js").write_text(template.replace("__SUBSCRIPTION_ENDPOINT__", endpoint))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
